server:
  port: 9875
spring:
  profiles:
    active: prod
camera:
  hk: rtsp://user:pass@ip:554/Streaming/tracks/101?starttime=20260413T120000Z&endtime=20260413T121000Z
  dh: rtsp://user:pass@ip:554/cam/playback?channel=1&starttime=2024_04_13_12_00_00&endtime=2024_04_13_13_00_00
  hls:
    # ffmpeg 落盘目录，同时也是 /hls/** 的静态资源根目录
    base-dir: /data/camera/hls/
    # URL 中解析不出 starttime/endtime 时的兜底最大拉流时长（秒）
    max-duration-seconds: 3600
  snowflake:
    # 多实例部署时必须给每个实例配不同的值（0-31），否则可能生成重复主键
    worker-id: 0
    datacenter-id: 0